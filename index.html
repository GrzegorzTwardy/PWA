<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkoZgłoszenie PWA</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <header class="text-center mb-4">
            <h1>🌱 EkoZgłoszenie</h1>
            <p class="text-muted">Zgłoś problem w Twoim mieście</p>
        </header>

        <div class="card shadow-sm p-3 mb-4">
            <video id="video" autoplay playsinline class="w-100 rounded mb-2"></video>
            <canvas id="canvas"></canvas>
            <img id="preview" alt="Podgląd zdjęcia">
            
            <button id="snap" class="btn btn-primary btn-lg w-100 mb-2">📸 Zrób zdjęcie</button>
            <button id="share" class="btn btn-success btn-lg w-100" disabled>📤 Udostępnij zgłoszenie</button>
        </div>

        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
